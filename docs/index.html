<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>股票內在價值系統</title>
  <link rel="stylesheet" href="./assets/app.css?v=1.0.2" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V7l8-4 8 4v12"/><path d="M8 19v-6h8v6"/><path d="M8 10h8"/></svg>
        </span>
        <div>
          <h1>股票內在價值系統</h1>
          <p class="sub" id="metaLine">載入中…</p>
        </div>
      </div>
    </header>

    <nav class="nav-cards" id="navCards" aria-label="主要分頁">
      <button class="nav-btn active" data-tab="overview">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg></span>
        <span>投資總覽</span>
      </button>
      <button class="nav-btn" data-tab="models">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M7 21h10"/><path d="M12 6c-3.5 0-6 2.2-6 6 0 2.6 1.5 4.2 4 5.3V21"/><path d="M12 6c3.5 0 6 2.2 6 6 0 2.6-1.5 4.2-4 5.3V21"/><circle cx="12" cy="11" r="1.4"/></svg></span>
        <span>估值模型</span>
      </button>
      <button class="nav-btn" data-tab="bands">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M9 19V5"/><path d="M14 19v-8"/><path d="M19 19V7"/><path d="M3 19h18"/></svg></span>
        <span>五檔價位</span>
      </button>
      <button class="nav-btn" data-tab="metrics">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4.5-5.5 3.5 3 6-8"/><circle cx="19" cy="4.5" r="1.3"/></svg></span>
        <span>財務指標</span>
      </button>
      <button class="nav-btn" data-tab="advice">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.2 3.6L17 8l-3.8 1.4L12 13l-1.2-3.6L7 8l3.8-1.4L12 3z"/><path d="M5 16l.7 2L8 19l-2.3.8L5 22l-.7-2.2L2 19l2.3-.9L5 16z"/><path d="M18 14.5l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6.6-1.7z"/></svg></span>
        <span>AI 建議</span>
      </button>
      <button class="nav-btn" data-tab="method">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"/></svg></span>
        <span>方法免責</span>
      </button>
    </nav>

    <section class="panel search-panel">
      <h2>觀察清單</h2>
      <p class="hint">點欄位名稱可切換排序。手機版用下方選單。每檔左側圖表鈕可看時間序列。</p>
      <label class="search">
        <span class="mag" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </span>
        <input id="q" type="search" placeholder="搜尋代號、名稱、行業、標籤…" autocomplete="off" />
      </label>
      <div class="filters" id="filters"></div>
      <div class="mobile-sort">
        <label>排序
          <select id="sortKey"></select>
        </label>
        <button type="button" id="sortDir" class="pill">大 → 小</button>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <main id="main"></main>

    <footer class="foot">
      <a id="excelLink" href="#">下載 Excel 報告</a>
      <span>·</span>
      <a href="./method.html">詳細方法</a>
      <span>·</span>
      <span>研究輔助，非投資建議</span>
    </footer>
  </div>

  <button type="button" class="theme-fab" id="themeBtn" title="切換深淺色" aria-label="切換深淺色">☾</button>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="modalClose" type="button" aria-label="關閉">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="modal" id="chartModal" hidden>
    <div class="sheet sheet-chart" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
      <button class="close" id="chartClose" type="button" aria-label="關閉">✕</button>
      <h2 id="chartTitle">時間序列</h2>
      <p class="hint" id="chartHint"></p>
      <div id="chartCanvasWrap"><canvas id="chartCanvas"></canvas></div>
    </div>
  </div>

  <script src="./assets/app.js?v=1.0.2"></script>
</body>
</html>
