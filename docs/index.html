<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>內在價值系統</title>
  <link rel="stylesheet" href="./assets/app.css?v=1.0.1" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">◉</span>
        <div>
          <h1>內在價值系統</h1>
          <p class="sub" id="metaLine">載入中…</p>
        </div>
      </div>
    </header>

    <nav class="nav-cards" id="navCards" aria-label="主要分頁">
      <button class="nav-btn active" data-tab="overview">
        <span class="ico">▣</span><span>投資總覽</span>
      </button>
      <button class="nav-btn" data-tab="models">
        <span class="ico">◈</span><span>估值模型</span>
      </button>
      <button class="nav-btn" data-tab="bands">
        <span class="ico">▤</span><span>五檔價位</span>
      </button>
      <button class="nav-btn" data-tab="metrics">
        <span class="ico">▦</span><span>財務指標</span>
      </button>
      <button class="nav-btn" data-tab="advice">
        <span class="ico">✎</span><span>AI 建議</span>
      </button>
      <button class="nav-btn" data-tab="method">
        <span class="ico">ⓘ</span><span>方法免責</span>
      </button>
    </nav>

    <section class="panel search-panel">
      <h2>觀察清單</h2>
      <p class="hint">點欄位名稱可切換由大到小 / 由小到大。手機版可用下方排序選單。</p>
      <label class="search">
        <span class="mag" aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="搜尋代號、名稱、行業、標籤…" autocomplete="off" />
      </label>
      <div class="filters" id="filters"></div>
      <div class="mobile-sort">
        <label>排序
          <select id="sortKey"></select>
        </label>
        <button type="button" id="sortDir" class="pill">大 → 小</button>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <main id="main"></main>

    <footer class="foot">
      <a id="excelLink" href="#">下載 Excel 報告</a>
      <span>·</span>
      <span>研究輔助，非投資建議</span>
    </footer>
  </div>

  <button type="button" class="theme-fab" id="themeBtn" title="切換深淺色" aria-label="切換深淺色">☾</button>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="modalClose" type="button" aria-label="關閉">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./assets/app.js?v=1.0.1"></script>
</body>
</html>
